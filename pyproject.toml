[project]
name = "fastapi-demo"
dynamic = ["version"]
authors = [{ name = "Xiang ZHU", email = "xiang.zhu@outlook.com" }]
description = "fastapi-demo"
urls.repository = "https://github.com/copdips/fastapi-demo"
urls.documentation = "https://github.com/copdips/fastapi-demo"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "alembic==1.20.1",
    "apitally[fastapi]==1.0.0",
    "asgi-correlation-id==5.0.1",
    "asyncpg==0.32.0",
    "azure-monitor-opentelemetry==1.8.12",
    "celery==5.7.0",
    "devtools==0.13.0",
    "email-validator==2.3.0",
    "fastapi-dependency==0.1.0",
    "fastapi-mcp==0.4.0",
    "fastapi[all]==0.162.4",
    "flower==2.2.0",
    "greenlet==3.5.6",
    "gunicorn==27.0.0",
    "logfire==5.6.0",
    "msgpack-asgi==3.0.0",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "orjson==3.13.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyinstrument==5.1.3",
    "python-ulid==4.1.0",
    "pyyaml==6.0.3",
    "redis==7.2.0",
    "rich==15.0.0",
    "scalar-fastapi==1.9.1",
    "sentry-sdk[fastapi]==2.74.0",
    "shortuuid==1.0.13",
    "sqladmin==0.32.0",
    "sqlalchemy==2.1.8",
    "sqlalchemy-data-model-visualizer==0.1.3",
    "sqlalchemy-schemadisplay==2.0",
    "sqlmodel==0.0.50",
    "taskiq==0.13.0",
    "taskiq-aio-pika==0.6.1",
    "taskiq-redis==1.2.2",
    "typer==0.29.0",
    "uvicorn[standard]==0.54.0",
    "viztracer==1.1.1",
]

[project.optional-dependencies]
docs = [
    "mike==2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-git-revision-date-localized-plugin==1.7.0",
    "mkdocs-glightbox==0.5.3",
    "mkdocs-material==9.8.1",
    "mkdocs-redirects==1.2.3",
    "mkdocs-video==1.5.0",
    "mkdocstrings-python==2.0.10",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "anyio==4.16.0",
    "coredumpy==0.5.0",
    "devtools==0.13.0",
    "erdantic==1.2.1",
    "ipython==9.18.1",
    "pre-commit==4.7.0",
    "py-spy==0.4.3",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-env==1.8.5",
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
    "sqlacodegen==4.0.4",
    "ty==0.0.100",
    "types-setuptools==84.2.0.20261104",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app_domain_based"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # https://beta.ruff.rs/docs/rules/
    "T201",   # print found # ! not used in prod
    "D",      # pydocstyle
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "ANN",    # flake8-annotations
    "PTH123", # pathlib-open - this would force pathlib usage anytime open or with open was used.
    "FA102",  # Missing `from __future__ import annotations`, but uses PEP 604 union.
    "ERA001", # Found commented-out code
    "TD",     # flake8-todo
    "FIX002", # Line contains TODO, consider resolving the issue
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
]
[tool.ruff.lint.per-file-ignores]
"tests*/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "INP001",  # implicit-namespace-package
    # "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    # "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]
"tools/**/*.py" = ["ALL"]
"migrations/**/*.py" = ["ALL"]
"_local_test/**/*.py" = ["ALL"]
[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
[tool.ruff.lint.pylint]
max-args = 8
[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator"]

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = true
exclude = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]
# include = ["app"]
# venvPath = "."
# venv = ".venv"

[tool.pytest.ini_options]
# testpaths = ["tests/unit"]  # no unit test yet
testpaths = ["tests/integration"]
# https://pytest-asyncio.readthedocs.io/en/latest/concepts.html#auto-mode
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = """
    -v -s
    --import-mode=importlib
    --junitxml=junit.xml
    --cov app
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70
    """
# env is enabled by pytest-env
env = ["TESTING=yes"]

[tool.coverage.run]
relative_files = true

[tool.pyrefly]
# python-version = "3.12"
project-excludes = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]


[tool.ty.src]
exclude = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]

[project]
name = "fastapi-demo"
dynamic = ["version"]
authors = [{ name = "Xiang ZHU", email = "xiang.zhu@outlook.com" }]
description = "fastapi-demo"
urls.repository = "https://github.com/copdips/fastapi-demo"
urls.documentation = "https://github.com/copdips/fastapi-demo"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "alembic>=1.17.0",
    "apitally[fastapi]>=0.11.1",
    "asgi-correlation-id>=4.3.4",
    "async-sqlmodel>=0.1.3",
    "asyncpg>=0.30.0",
    "azure-monitor-opentelemetry>=1.8.6",
    "celery>=5.5.3",
    "devtools>=0.12.2",
    "email-validator>=2.3.0",
    "fastapi-dependency>=0.1.0",
    "fastapi-mcp>=0.4.0",
    "fastapi[all]>=0.110.0",
    "flower>=2.0.1",
    "gunicorn>=23.0.0",
    "logfire>=0.48.0",
    "msgpack-asgi>=2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "orjson>=3.11.3",
    "pydantic>=2",
    "pydantic-settings>=2.11.0",
    "pyinstrument>=5.1.1",
    "python-ulid>=3.1.0",
    "pyyaml>=6",
    "redis>=6.4.0",
    "rich>=13.4.2",
    "scalar-fastapi>=1.6.2",
    "sentry-sdk[fastapi]>=2.42.0",
    "shortuuid>=1.0.13",
    "sqladmin>=0.21.0",
    "sqlalchemy>=2.0.44",
    "sqlalchemy-data-model-visualizer>=0.1.3",
    "sqlalchemy-schemadisplay>=2.0",
    "sqlmodel>=0.0.16",
    "taskiq>=0.11.18",
    "taskiq-aio-pika>=0.4.3",
    "taskiq-redis>=1.1.2",
    "typer>=0.12.3",
    "uvicorn[standard]>=0.38.0",
    "viztracer>=1.0.4",
]

[project.optional-dependencies]
docs = [
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-glightbox>=0.5.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-video>=1.5.0",
    "mkdocstrings-python>=1.18.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "anyio>=4.11.0",
    "coredumpy>=0.4.3",
    "devtools>=0.12.2",
    "erdantic>=1.2.0",
    "ipython>=9.6.0",
    "pre-commit>=4.3.0",
    "py-spy>=0.4.1",
    "pyright[nodejs]>=1.1.406",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.1",
    "sqlacodegen>=3.0.0rc5",
    "ty>=0.0.1a23",
    "types-setuptools>=80.9.0.20250822",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app_domain_based"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.ruff]
fix = true
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # https://beta.ruff.rs/docs/rules/
    "T201",   # print found # ! not used in prod
    "D",      # pydocstyle
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "ANN",    # flake8-annotations
    "PTH123", # pathlib-open - this would force pathlib usage anytime open or with open was used.
    "FA102",  # Missing `from __future__ import annotations`, but uses PEP 604 union.
    "ERA001", # Found commented-out code
    "TD",     # flake8-todo
    "FIX002", # Line contains TODO, consider resolving the issue
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
]
[tool.ruff.lint.per-file-ignores]
"tests*/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    # "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    # "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
]
"tools/**/*.py" = ["ALL"]
"migrations/**/*.py" = ["ALL"]
"_local_test/**/*.py" = ["ALL"]
[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
[tool.ruff.lint.pylint]
max-args = 8
[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator"]

[tool.pyright]
reportUnnecessaryTypeIgnoreComment = true
exclude = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]
# include = ["app"]
# venvPath = "."
# venv = ".venv"

[tool.pytest.ini_options]
# testpaths = ["tests/unit"]  # no unit test yet
testpaths = ["tests/integration"]
# https://pytest-asyncio.readthedocs.io/en/latest/concepts.html#auto-mode
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = """
    -v -s
    --junitxml=junit.xml
    --cov app
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70
    """
# env is enabled by pytest-env
env = ["TESTING=yes"]

[tool.coverage.run]
relative_files = true

[tool.pyrefly]
# python-version = "3.12"
project-excludes = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]


[tool.ty.src]
exclude = ["_local_test", "tools", "migrations", ".venv", "app_sqlalchemy_v1"]

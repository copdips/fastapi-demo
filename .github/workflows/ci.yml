name: ci
run-name: ${{ github.workflow}} by @${{ github.actor }} ${{ github.event.pull_request.head.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - main

concurrency:
  group: ${{ github.workflow}}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  ci_lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      # .python-version pins the default interpreter for local use; the matrix
      # must win, otherwise the 3.15 job would silently test 3.14.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is still a release candidate.
          allow-prereleases: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Use public pip index only for ci demo
        run: echo "https://pypi.org/simple" > PIP_INDEX_URL.secret

      - name: create .env file
        # The demo uses the compose `postgres` service only, so the committed
        # ci.env carries every value. No repository secret is involved, which
        # also keeps Dependabot PRs (they cannot read secrets) working.
        run: |
          cp .github/ci.env .env
          wc -l .env

      - name: Install deps
        run: |
          python --version
          make ci-install
        # env:
        #   UV_SYSTEM_PYTHON: 1

      - name: Run lint
        run: |
          export LOGFIRE_SEND_TO_LOGFIRE=false
          # export SKIP=pytest
          make lint

  ci_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      # .python-version pins the default interpreter for local use; the matrix
      # must win, otherwise the 3.15 job would silently test 3.14.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 is still a release candidate.
          allow-prereleases: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Use public pip index only for ci demo
        run: echo "https://pypi.org/simple" > PIP_INDEX_URL.secret

      - name: create .env file
        # The demo uses the compose `postgres` service only, so the committed
        # ci.env carries every value. No repository secret is involved, which
        # also keeps Dependabot PRs (they cannot read secrets) working.
        run: |
          cp .github/ci.env .env
          wc -l .env

      - name: Check Docker Compose
        # Compose v2 ships with the runner; the v1 `docker-compose` binary
        # does not exist on the Ubuntu 26.04 image.
        run: docker compose version

      - name: Build and run the Docker images
        run: make run-docker-compose

      - name: Install deps
        run: |
          python --version
          make ci-install
        # env:
        #   UV_SYSTEM_PYTHON: 1

      - name: Run tests
        # above `make lint` includes pytest with default options
        run: |
          export LOGFIRE_SEND_TO_LOGFIRE=false
          make test

      - name: Upload results to Codecov
        if: ${{ strategy.job-index == 0 }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop containers
        if: always()
        run: docker compose down

  ci_all_green:
    if: always()
    needs:
      - ci_lint
      - ci_test
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
